[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "pbg-simbio"
version = "0.1.0"
description = "Process-bigraph wrapper for simbio (Chemical Reaction Network simulation)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{name = "Eran Agmon", email = "agmon.eran@gmail.com"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "bigraph-schema>=0.0.60",
    "process-bigraph>=0.0.66",
    "pbg-superpowers",
    "simbio>=1.1.0",
    "antimony>=2.13",
    "python-libsbml>=5.20",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "plotly", "bigraph-viz"]
# Workspace dashboard stack (the `vivarium-dashboard serve` CLI + report deps).
# Not needed to use the wrapper; install with `pip install pbg-simbio[dashboard]`.
dashboard = [
    "vivarium-dashboard",
    "bigraph-viz>=2.0.3",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
]

[project.urls]
Homepage = "https://github.com/vivarium-collective/pbg-simbio"
Issues = "https://github.com/vivarium-collective/pbg-simbio/issues"

[tool.hatch.build.targets.wheel]
packages = ["pbg_simbio"]

[tool.uv.sources]
# Neither is on PyPI; resolve from git so clean installs and Docker builds work
# (no local-path assumptions). pbg-superpowers is required by the composite
# generators; vivarium-dashboard is only needed for the optional `dashboard` extra.
pbg-superpowers = { git = "https://github.com/vivarium-collective/pbg-superpowers.git", branch = "main" }
vivarium-dashboard = { git = "https://github.com/vivarium-collective/vivarium-dashboard.git", branch = "main" }
